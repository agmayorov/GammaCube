# Пример конфига запуска. Запуск из каталога сборки:
#
#   ./GammaCube -i ../run.mac -c ../configs/example.cfg
#   ./GammaCube -i ../run.mac -c ../configs/example.cfg --theta-max 120 -s 42
#
# Формат: те же флаги, что в командной строке; '#' начинает комментарий; в значениях нет пробелов.
# Флаги из командной строки всегда приоритетнее файла. Описание флагов — в README.
# Число событий задаётся в run.mac (/run/beamOn), макрофайл — флагом -i.
# Закомментированные строки показывают остальные флаги, значения в них — примеры, не умолчания.

# --- Вывод и запуск ---
--output-file Example
# --threads 8
# --seed 12345
# --bins 1000

# --- Геометрия ---
--geometry-config tunacan      # default | tunacan | cubesat | experiment
--engine sputnix               # sputnix | geoscan, только с tunacan и cubesat
# --detector CsI
# --crystal-sipm-config 12-cross
# --veto-chamfer-height 2
# --veto-top-rounded 5
# --polished

# --- Триггер и пороги ---
--trigger gamma                # gamma: Crystal && !Veto | charged: Crystal && (Veto || BottomVeto)
# --crystal-threshold 0.05     # МэВ
# --veto-threshold 0.1         # МэВ

# --- Поток ---
--flux-type PLAW               # Uniform | Galactic | PLAW | COMP | Table | SEP
--flux-dir isotropic           # isotropic | isotropic_up | isotropic_down | flat | point_beam | point_iso

# Часть сферы для isotropic, градусы
--theta-min 60
--theta-max 90
# --phi-min 300
# --phi-max 60
# --axis-theta 60
# --axis-phi 0

# Пучок для flat, point_beam, point_iso, градусы
# --theta 45
# --phi 30

# Точечный источник для point_beam, point_iso
# --source-r 100               # мм
# --source-z 50                # мм
# --cone 20                    # полуугол, градусы, только point_iso

# --- Оптика ---
# --use-optics
# --yield-scale 1
# --crystal-optic-threshold 0
# --veto-optic-threshold 0
# --bottom-veto-optic-threshold 0
# --photon-time-limit 2        # мкс
# --sipm-cells 3600
# --sipm-recovery 95           # нс
# --sipm-crosstalk 0.1
# --weight4 1
# --weight8 1

# --- Сохранение данных ---
# --save-secondaries
# --save-photons               # только вместе с --use-optics
